{% extends "base.html" %}

{% block title %}Create Order · Cafe Manager{% endblock %}

{% block content %}

    <div class="page-header">
        <div>
            <h1 style="margin-bottom:4px;"><i class="bi bi-cart-plus"></i> Create New Order</h1>
            <p class="page-subtitle">Place a new order for a customer</p>
        </div>
    </div>

    <div class="form-card">

        <form method="POST">

            <div class="field">
                <label>Select Food</label>
                <select name="food_id" required>
                    <option value="">-- Select Food --</option>
                    {% for food in foods %}
                        <option value="{{ food.food_id }}">
                            {{ food.food_name }} - ₹{{ food.price }} (Stock: {{ food.quantity }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label>Quantity</label>
                <input
                    type="number"
                    name="quantity"
                    min="1"
                    required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn--primary">
                    <i class="bi bi-check-lg"></i> Create Order
                </button>

                <a 
                class="back"
                href="{{ url_for('orders') }}">
                    cancel
                </a>
            </div>

        </form>

    </div>

{% endblock %}
