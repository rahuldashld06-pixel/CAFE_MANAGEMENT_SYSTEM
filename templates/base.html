<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Cafe Manager{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="app-shell">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-brand">
                <span class="brand-mark"><i class="bi bi-cup-hot-fill"></i></span>
                <span class="brand-text">Cafe Manager<small>Food &amp; Service Admin</small></span>
            </div>

            <nav class="sidebar-nav">

                <a href="{{ url_for('home') }}"
                   class="nav-link {{ 'active' if request.endpoint in ['home', 'dashboard'] else '' }}">
                    <i class="bi bi-speedometer2"></i><span>Dashboard</span>
                </a>

                <a href="{{ url_for('foods') }}"
                   class="nav-link {{ 'active' if request.endpoint in ['foods', 'add_food', 'edit_food'] else '' }}">
                    <i class="bi bi-egg-fried"></i><span>Food Management</span>
                </a>

                <a href="{{ url_for('categories') }}"
                   class="nav-link {{ 'active' if request.endpoint in ['categories', 'add_category', 'edit_category'] else '' }}">
                    <i class="bi bi-tags-fill"></i><span>Category Management</span>
                </a>

                <a href="{{ url_for('inventory') }}"
                   class="nav-link {{ 'active' if request.endpoint in ['inventory', 'update_stock'] else '' }}">
                    <i class="bi bi-boxes"></i><span>Inventory</span>
                </a>

                <a href="{{ url_for('orders') }}"
                   class="nav-link {{ 'active' if request.endpoint in ['orders', 'add_order', 'order_details'] else '' }}">
                    <i class="bi bi-receipt-cutoff"></i><span>Order Management</span>
                </a>

                <a href="#" class="nav-link nav-link--soon">
                    <i class="bi bi-credit-card-2-front"></i><span>Billing</span>
                </a>

                <a href="#" class="nav-link nav-link--soon">
                    <i class="bi bi-graph-up-arrow"></i><span>Reports</span>
                </a>

            </nav>

        </aside>

        <!-- Main Content -->
        <main class="main">
            {% block content %}{% endblock %}
        </main>

    </div>

</body>

</html>
