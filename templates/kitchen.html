{% extends "base.html" %}

{% block title %}Kitchen{% endblock %}

{% block content %}

<div class="page-header page-header--stack">
    <div>
        <div class="eyebrow">Kitchen</div>
        <h1><i class="bi bi-fire"></i> Kitchen Screen</h1>
        <p>Today's orders.</p>
    </div>

    <div class="page-header__actions">
        <span class="kitchen-state" id="kitchenState">
            <span class="kitchen-state__dot"></span>
            <span id="kitchenStateText">Watching</span>
        </span>
    </div>
</div>

<div id="kitchenBoard" class="kitchen-board">
    <p class="kitchen-empty">Looking for orders&hellip;</p>
</div>

<script>
// The shell is defined at the end of <body>, after this page's own
// markup, so nothing here can touch window.CafeShell while the document
// is still parsing. Waiting until the page is built is the difference
// between this screen working and silently doing nothing at all: the
// first call threw, the rest never started, and the bar went on saying
// "Watching" because that is what the markup says before any check.
function startKitchenScreen() {
    "use strict";

    var board = document.getElementById("kitchenBoard");
    if (!board) return;

    function csrfToken() {
        return (window.CafeShell && window.CafeShell.csrfToken) || "";
    }

    var LOOK_EVERY = 6000;

    var stateText = document.getElementById("kitchenStateText");
    var state = document.getElementById("kitchenState");

    function say(text, ok) {
        stateText.textContent = text;
        state.classList.toggle("kitchen-state--lost", !ok);
    }

    // ---- Drawing ----
    function escapeHtml(value) {
        var holder = document.createElement("div");
        holder.textContent = value == null ? "" : String(value);
        return holder.innerHTML;
    }

    // Each dish on a ticket is its own job, so each gets its own mark.
    // Tap it as that dish goes out; tapping the last one closes the order
    // on its own, so nobody has to remember to press Done as well.
    //
    // Colour alone, the same three the rest of the app uses: hollow while
    // it is still to make, green once it is, red if the whole ticket was
    // called off.
    function dish(order, item) {
        var settled = order.status !== "Pending";
        // A finished ticket reads as all made whatever the lines say, so
        // an order closed by the Done button - or by the overnight sweep,
        // which never touched the lines at all - does not sit there
        // looking half-cooked.
        var made = item.made || order.status === "Completed";
        var kind = order.status === "Cancelled" ? "off"
            : made ? "made" : "todo";

        var mark = settled
            ? '<span class="kitchen-tick" aria-hidden="true"></span>'
            : '<button type="button" class="kitchen-tick"'
                + ' data-item="' + escapeHtml(item.item_id) + '"'
                + ' aria-pressed="' + (made ? "true" : "false") + '"'
                + ' aria-label="' + escapeHtml(item.name)
                + (made ? ', made' : ', not made yet') + '"></button>';

        return '<li class="kitchen-line kitchen-line--' + kind + '">'
            + mark
            + '<span class="kitchen-line__text">'
            + '<span class="kitchen-qty">' + escapeHtml(item.quantity)
            + '</span> ' + escapeHtml(item.name)
            + '</span></li>';
    }

    function card(order) {
        var lines = order.items.map(function (item) {
            return dish(order, item);
        }).join("");

        var waiting = order.status === "Pending";
        var number = escapeHtml(order.daily_no || order.order_id);

        var classes = "kitchen-ticket";
        if (order.source === "qr") classes += " kitchen-ticket--phone";
        if (order.status === "Completed") classes += " kitchen-ticket--done";
        if (order.status === "Cancelled") classes += " kitchen-ticket--cancelled";

        // Nothing to press once an order is finished or called off.
        // The marks on its lines are the whole of what it has left to
        // say, and they stop being tappable at the same moment.
        var buttons = waiting
            ? '<button type="button" class="btn btn--delete btn--sm"'
                + ' data-cancel="' + escapeHtml(order.order_id) + '"'
                + ' data-number="' + number + '">Cancel</button>'
                + '<button type="button" class="btn btn--primary btn--sm"'
                + ' data-done="' + escapeHtml(order.order_id) + '">Done</button>'
            : '';

        return '<article class="' + classes + '">'
            + '<header class="kitchen-ticket__head">'
            + '<span class="kitchen-ticket__id">#' + number + '</span>'
            + '<span class="kitchen-ticket__from">'
            + (order.source === "qr" ? "From a table" : "At the counter")
            + '</span>'
            + '</header>'
            + '<ul class="kitchen-ticket__items">'
            + (lines || '<li class="kitchen-line">No items</li>')
            + '</ul>'
            + '<footer class="kitchen-ticket__foot">'
            + '<span>' + escapeHtml(order.placed) + '</span>'
            + '<span class="kitchen-ticket__actions">' + buttons + '</span>'
            + '</footer>'
            + '</article>';
    }

    var lastDrawn = "";

    function draw(orders) {
        // Redrawing every few seconds would fight anyone mid-tap, so the
        // board is only rebuilt when it has actually changed.
        var signature = JSON.stringify(orders);
        if (signature === lastDrawn) return;
        lastDrawn = signature;

        if (!orders.length) {
            board.innerHTML =
                '<p class="kitchen-empty">No orders yet today. '
                + 'New ones appear here on their own.</p>';
            return;
        }
        board.innerHTML = orders.map(card).join("");
    }

    function look() {
        fetch("/api/kitchen/board", {
            credentials: "same-origin",
            headers: { "X-Requested-With": "XMLHttpRequest" }
        }).then(function (response) {
            // The board answering is what says this screen is live. It
            // used to be a heartbeat of its own, whose job was telling
            // the counter screens to leave the printing to this one -
            // and nothing prints by itself any more.
            say(response.ok ? "Watching" : "Not reaching the server",
                response.ok);
            return response.json();
        }).then(function (data) {
            var orders = (data && data.orders) || [];
            draw(orders);
        }).catch(function () {
            say("Not reaching the server", false);
        });
    }

    function send(button, url) {
        button.disabled = true;
        var form = new FormData();
        form.append("_csrf_token", csrfToken());

        // Asked as a fetch, so the server answers yes or no instead of
        // handing back a page and leaving a message for the next one.
        fetch(url, {
            method: "POST",
            body: form,
            credentials: "same-origin",
            headers: { "X-Requested-With": "XMLHttpRequest" }
        }).catch(function () { }).then(function () {
            lastDrawn = "";     // force a redraw
            look();
        });
    }

    board.addEventListener("click", function (event) {
        var tick = event.target.closest("[data-item]");
        if (tick) {
            send(tick, "/api/kitchen/item/" + tick.dataset.item);
            return;
        }

        var done = event.target.closest("[data-done]");
        if (done) {
            send(done, "/orders/complete/" + done.dataset.done);
            return;
        }

        var cancel = event.target.closest("[data-cancel]");
        if (!cancel) return;

        // Worth asking. It puts the food back into stock and cannot be
        // taken back, and these are big buttons on a screen in a kitchen.
        var sure = window.confirm(
            "Cancel order #" + cancel.dataset.number + "? The items go back "
            + "into stock. The order stays in billing history.");
        if (!sure) return;

        send(cancel, "/orders/cancel/" + cancel.dataset.cancel);
    });

    look();
    window.setInterval(look, LOOK_EVERY);

    // A tablet that went to sleep wakes up behind; catch up at once.
    document.addEventListener("visibilitychange", function () {
        if (!document.hidden) { look(); }
    });

    // Ask the device not to dim. Widely ignored, and harmless when it is.
    if (navigator.wakeLock && navigator.wakeLock.request) {
        var hold = function () {
            navigator.wakeLock.request("screen").catch(function () { });
        };
        hold();
        document.addEventListener("visibilitychange", function () {
            if (!document.hidden) hold();
        });
    }
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startKitchenScreen);
} else {
    startKitchenScreen();
}
</script>

{% endblock %}
