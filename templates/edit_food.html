{% extends "base.html" %}

{% block title %}Edit Food · Cafe Manager{% endblock %}

{% block content %}

    <div class="page-header">
        <div>
            <h1 style="margin-bottom:4px;"><i class="bi bi-pencil-fill"></i> Edit Food</h1>
            <p class="page-subtitle">Update details for this menu item</p>
        </div>
    </div>

    <div class="form-card">

        <form method="POST">

            <!-- Food Name -->
            <div class="field">
                <label>Food Name</label>
                <input
                    type="text"
                    name="food_name"
                    value="{{ food.food_name }}"
                    required>
            </div>

            <!-- Category -->
            <div class="field">
                <label>Category</label>
                <select name="category_id" required>
                    {% for category in categories %}
                        <option
                            value="{{ category.category_id }}"
                            {% if category.category_id == food.category_id %}selected{% endif %}>
                            {{ category.category_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Description -->
            <div class="field">
                <label>Description</label>
                <textarea name="description">{{ food.description }}</textarea>
            </div>

            <!-- Price -->
            <div class="field">
                <label>Price (₹)</label>
                <input
                    type="number"
                    name="price"
                    step="0.01"
                    min="0"
                    value="{{ food.price }}"
                    required>
            </div>

            <!-- Quantity -->
            <div class="field">
                <label>Stock Quantity</label>
                <input
                    type="number"
                    name="quantity"
                    min="0"
                    value="{{ food.quantity }}"
                    required>
            </div>

            <!-- Minimum Stock -->
            <div class="field">
                <label>Minimum Stock Level</label>
                <input
                    type="number"
                    name="minimum_stock"
                    min="0"
                    value="{{ food.minimum_stock }}"
                    required>
            </div>

            <!-- Availability -->
            <label class="switch-field">
                <input
                    type="checkbox"
                    name="availability"
                    {% if food.availability %}checked{% endif %}>
                <span class="switch-slider"></span>
                Food Available
            </label>

            <div class="form-actions">
                <button type="submit" class="btn btn--primary">
                    <i class="bi bi-check-lg"></i> Update Food
                </button>

                <a href="{{ url_for('foods') }}">
                    Cancel
                </a>
            </div>

        </form>

    </div>

{% endblock %}
