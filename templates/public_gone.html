<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Menu not found · {{ platform_name }}</title>
    {% include "_favicon.html" %}
    <meta name="theme-color" content="#2A1C14">
    <meta name="robots" content="noindex">
    <meta name="description" content="This ordering code is no longer in use. Ask a member of staff for the current one.">
    <link rel="stylesheet" href="{{ asset_url('css/theme.css') }}">
    <link rel="stylesheet" href="{{ asset_url('css/public.css') }}">
</head>

<body>

<div class="p-wrap">
    <div class="p-empty" style="margin-top:80px;">
        <p><strong>This menu is not available.</strong></p>
        <p>
            The code may have been replaced, or the cafe may have closed
            this way of ordering. Please ask a member of staff.
        </p>
    </div>
</div>

</body>
</html>
