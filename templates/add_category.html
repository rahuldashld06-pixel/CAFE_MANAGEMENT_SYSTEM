{% extends "base.html" %}

{% block title %}Add Category · Cafe Manager{% endblock %}

{% block content %}

    <div class="page-header">
        <div>
            <h1 style="margin-bottom:4px;"><i class="bi bi-tags-fill"></i> Add Category</h1>
            <p class="page-subtitle">Create a new menu category</p>
        </div>
    </div>

    <div class="form-card">

        <form method="POST">

            <div class="field">
                <label>Category Name</label>
                <input
                    type="text"
                    name="category_name"
                    placeholder="Example: Coffee"
                    required>
            </div>

            <div class="field">
                <label>Description</label>
                <textarea
                    name="description"
                    placeholder="Enter category description"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn--primary">
                    <i class="bi bi-check-lg"></i> Add Category
                </button>

                <a href="{{ url_for('categories') }}">
                    Cancel
                </a>
            </div>

        </form>

    </div>

{% endblock %}
