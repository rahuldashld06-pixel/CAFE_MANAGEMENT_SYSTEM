{% extends "base.html" %}

{% block title %}Update Stock · Cafe Manager{% endblock %}

{% block content %}

    <div class="page-header">
        <div>
            <h1 style="margin-bottom:4px;"><i class="bi bi-boxes"></i> Update Stock</h1>
            <p class="page-subtitle">{{ item.food_name }}</p>
        </div>
    </div>

    <div class="form-card">

        <form method="POST">

            <!-- Quantity -->
            <div class="field">
                <label>Current Stock Quantity</label>
                <input
                    type="number"
                    name="quantity"
                    min="0"
                    value="{{ item.quantity }}"
                    required>
            </div>

            <!-- Minimum Stock -->
            <div class="field">
                <label>Minimum Stock Level</label>
                <input
                    type="number"
                    name="minimum_stock"
                    min="0"
                    value="{{ item.minimum_stock }}"
                    required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn--primary">
                    <i class="bi bi-check-lg"></i> Update Stock
                </button>

                <a href="{{ url_for('inventory') }}">
                    Cancel
                </a>
            </div>

        </form>

    </div>

{% endblock %}
