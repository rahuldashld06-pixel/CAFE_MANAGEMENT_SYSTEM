{% extends "base.html" %}

{% block title %}Edit Category · Cafe Manager{% endblock %}

{% block content %}

    <div class="page-header">
        <div>
            <h1 style="margin-bottom:4px;"><i class="bi bi-pencil-fill"></i> Edit Category</h1>
            <p class="page-subtitle">Update this category's details</p>
        </div>
    </div>

    <div class="form-card">

        <form method="POST">

            <div class="field">
                <label>Category Name</label>
                <input
                    type="text"
                    name="category_name"
                    value="{{ category.category_name }}"
                    required>
            </div>

            <div class="field">
                <label>Description</label>
                <textarea name="description">{{ category.description or "" }}</textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn--primary">
                    <i class="bi bi-check-lg"></i> Update Category
                </button>

                <a href="{{ url_for('categories') }}">
                    Cancel
                </a>
            </div>

        </form>

    </div>

{% endblock %}
